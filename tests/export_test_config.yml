#!/usr/bin/env yaml
# Comprehensive test configuration for all export features
# Run from project root: python3 tools/export.py tests/export_test_config.yml
# Run single export: python3 tools/export.py tests/export_test_config.yml --name <name>
#
# All output goes to test_output/ directory (git-ignored)
# Paths are relative to config file location (tests/)
# Use ../examples/ to reference examples/ directory from tests/
# Git metadata is automatically captured (GitCommit, GitBranch, GitTag, GitDirty)
# and embedded in 3MF files when run from a git repo

export:
  # ============================================================================
  # 1. BASIC EXPORT - Simple body list
  # ============================================================================
  - name: basic_export
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
    output: ../test_output/basic_export.3mf
    keep_stl: false
    metadata:
      Test: "Basic export"
      Description: "Single body export test"

  # ============================================================================
  # 2. MULTIPLE BODIES - Export multiple bodies
  # ============================================================================
  - name: multiple_bodies
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
    output: ../test_output/multiple_bodies.3mf
    keep_stl: false
    metadata:
      Test: "Multiple bodies"
      Description: "Export multiple bodies in one 3MF"

  # ============================================================================
  # 3. DUPLICATE BODY - Same body exported twice (for making pairs)
  # ============================================================================
  - name: duplicate_body
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
      - Body
    output: ../test_output/duplicate_body.3mf
    keep_stl: false
    metadata:
      Test: "Duplicate body"
      Description: "Export same body twice for mirrored parts"

  # ============================================================================
  # 4. TEMPLATE EXPORT - Use a template 3MF file
  # ============================================================================
  - name: template_export
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
    output: ../test_output/template_export.3mf
    template: ../examples/template_print_settings.3mf
    keep_stl: false
    metadata:
      Test: "Template export"
      Description: "Export with template for printer settings"

  # ============================================================================
  # 5. STL RETENTION - Keep generated STL files
  # ============================================================================
  - name: stl_retention
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
    output: ../test_output/stl_retention.3mf
    keep_stl: true
    stl_output_dir: ../test_output/stl/
    metadata:
      Test: "STL retention"
      Description: "Keep STL files after export"

  # ============================================================================
  # 6. CUSTOM METADATA - Full metadata example
  # ============================================================================
  - name: custom_metadata
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
    output: ../test_output/custom_metadata.3mf
    keep_stl: false
    metadata:
      Project: "Custom Metadata Test"
      Version: "1.0.0"
      Author: "Test Author"
      License: "CC-BY-SA-4.0"
      Description: "Test with custom metadata fields"
      CustomField: "CustomValue"

  # ============================================================================
  # 7. PROPERTY-BASED EXPORT - Bodies marked with ExportTo3MF=True
  # Uses FreeCAD custom properties on bodies
  # ============================================================================
  - name: property_export
    source: ../examples/example_properties.FCStd
    body_source: properties
    output: ../test_output/property_export.3mf
    keep_stl: false
    metadata:
      Test: "Property-based export"
      Description: "Bodies with ExportTo3MF=True property are exported"

  # ============================================================================
  # 8. TECHDRAW EXPORT - Generate PDF from TechDraw pages
  # Requires: FreeCAD GUI binary (not freecadcmd)
  # ============================================================================
  - name: techdraw_export
    source: ../examples/example_techdraw.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
      - Box
    output: ../test_output/techdraw_export.3mf
    keep_stl: false
    metadata:
      Project: "TechDraw Export"
      Version: "1.0"

    techdraw:
      pages: []
      output_dir: ../test_output/drawings/
      format: pdf
      instructions: ../examples/INSTRUCTIONS.md

    bom:
      source: assembly
      output: ../test_output/bom.csv
      fields:
        - material

  # ============================================================================
  # 9. TECHDRAW ONLY (no BOM)
  # ============================================================================
  - name: techdraw_only
    source: ../examples/example_techdraw.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
    output: ../test_output/techdraw_only.3mf
    techdraw:
      pages: []
      output_dir: ../test_output/drawings/
      format: pdf

  # ============================================================================
  # 10. BOM ONLY (no TechDraw)
  # ============================================================================
  - name: bom_only
    source: ../examples/example_techdraw.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
      - Box
    output: ../test_output/bom_only.3mf
    bom:
      source: assembly
      output: ../test_output/bom_only.csv
      fields:
        - material

  # ============================================================================
  # 11. SCREENSHOTS - Generate screenshots for Thingiverse/Printables
  # Requires: FreeCAD GUI binary (not freecadcmd)
  # ============================================================================
  - name: screenshots_full
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
    output: ../test_output/screenshots_full.3mf
    screenshots:
      enabled: true
      output_dir: ../test_output/images/
      views: [isometric, front, top, right]
      resolution: [1920, 1080]
      background: [255, 255, 255, 255]
      format: png
      composite: true
    metadata:
      Test: "Screenshots"
      Description: "Generate screenshots for publication"

  # ============================================================================
  # 12. SCREENSHOTS MINIMAL - Just enabled flag
  # ============================================================================
  - name: screenshots_minimal
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
    output: ../test_output/screenshots_minimal.3mf
    screenshots: true
    metadata:
      Test: "Minimal screenshots"

  # ============================================================================
  # 13. COMBINED: TechDraw + BOM + Screenshots
  # Requires: FreeCAD GUI binary for TechDraw and screenshots
  # ============================================================================
  - name: combined_export
    source: ../examples/example_techdraw.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
    output: ../test_output/combined_export.3mf
    keep_stl: false
    screenshots:
      enabled: true
      output_dir: ../test_output/images/
      views: [isometric, front]
      format: png
    techdraw:
      pages: []
      output_dir: ../test_output/drawings/
      format: pdf
    bom:
      source: assembly
      output: ../test_output/bom_combined.csv
    metadata:
      Project: "Combined Export"
      Description: "3MF + PDF + CSV + images all in one run"
