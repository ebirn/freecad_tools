#!/usr/bin/env yaml
# Comprehensive test configuration for export features
# Run from project root: python3 tools/export.py tests/export_test_config.yml

export:
  # 1. BASIC EXPORT - Simple body list
  - name: basic_export
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
    output: ../test_output/basic_export.3mf
    keep_stl: false

  # 2. MULTIPLE BODIES
  - name: multiple_bodies
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
    output: ../test_output/multiple_bodies.3mf
    keep_stl: false

  # 3. DUPLICATE BODY
  - name: duplicate_body
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
      - Body
    output: ../test_output/duplicate_body.3mf
    keep_stl: false

  # 4. TEMPLATE EXPORT
  - name: template_export
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
    output: ../test_output/template_export.3mf
    template: ../examples/template_print_settings.3mf
    keep_stl: false

  # 5. STL RETENTION
  - name: stl_retention
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
    output: ../test_output/stl_retention.3mf
    keep_stl: true
    stl_output_dir: ../test_output/stl/

  # 6. CUSTOM METADATA
  - name: custom_metadata
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
    output: ../test_output/custom_metadata.3mf
    keep_stl: false
    metadata:
      Project: "Custom Metadata Test"
      Version: "1.0.0"
      Author: "Test Author"

  # 7. PROPERTY-BASED EXPORT
  - name: property_export
    source: ../examples/example_properties.FCStd
    body_source: properties
    output: ../test_output/property_export.3mf
    keep_stl: false

  # 8. TECHDRAW EXPORT
  - name: techdraw_export
    source: ../examples/example_techdraw.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
      - Box
    output: ../test_output/techdraw_export.3mf
    keep_stl: false
    techdraw:
      pages: []
      output_dir: ../test_output/drawings/
      format: pdf
    bom:
      source: assembly
      output: ../test_output/bom.csv
      fields:
        - material

  # 9. TECHDRAW ONLY
  - name: techdraw_only
    source: ../examples/example_techdraw.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
    output: ../test_output/techdraw_only.3mf
    techdraw:
      pages: []
      output_dir: ../test_output/drawings/
      format: pdf

  # 10. BOM ONLY
  - name: bom_only
    source: ../examples/example_techdraw.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
      - Box
    output: ../test_output/bom_only.3mf
    bom:
      source: assembly
      output: ../test_output/bom_only.csv
      fields:
        - material

  # 11. SCREENSHOTS FULL
  - name: screenshots_full
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
    output: ../test_output/screenshots_full.3mf
    screenshots:
      enabled: true
      output_dir: ../test_output/images/
      views: [isometric, front, top, right]
      resolution: [1920, 1080]
      background: [255, 255, 255, 255]
      format: png
      composite: true

  # 12. SCREENSHOTS MINIMAL
  - name: screenshots_minimal
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
    output: ../test_output/screenshots_minimal.3mf
    screenshots:
      enabled: true
      output_dir: ../test_output/images/

  # 13. COMBINED: TechDraw + BOM + Screenshots
  - name: combined_export
    source: ../examples/example_techdraw.FCStd
    body_source: config
    bodies:
      - Body
      - Body001
    output: ../test_output/combined_export.3mf
    keep_stl: false
    screenshots:
      enabled: true
      output_dir: ../test_output/images/
      views: [isometric, front]
      format: png
    techdraw:
      pages: []
      output_dir: ../test_output/drawings/
      format: pdf
    bom:
      source: assembly
      output: ../test_output/bom_combined.csv

  # 14. SLICER EXAMPLE - Native profile mode
  - name: slicer_prusa_example
    source: ../examples/example.FCStd
    body_source: config
    bodies:
      - Body
    output: ../test_output/slicer_prusa_example.3mf
    template: ../examples/template_print_settings.3mf
    keep_stl: false
    slicer:
      enabled: true
      engine: prusa
      output_dir: ../test_output/gcode/
      output_name: "{name}_{engine}_{date}.gcode"
      run_after_export: true
      prusa:
        printer_profile: "Original Prusa MK4"
        print_profile: "0.20mm SPEED"
        material_profile: "Prusament PLA"
