[project]
name = "freecad-tools"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
    "lib3mf==2.5.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.12",
    "yamllint==1.38.0",
    "pylint==4.0.5",
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["hooks*", "macros*", "templates*", "tests*", "examples*"]

# Ruff configuration - fast Python linting and formatting
[tool.ruff]
line-length = 120
target-version = "py310"
include = ["*.py", "*.pyi"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (we prefer to handle this selectively)
]

# Pylint configuration - deep code analysis
[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "line-too-long",      # Ruff handles this
    "too-many-arguments",
    "fixme",
    "too-many-locals",
    "import-error",       # External deps like FreeCAD, lib3mf only available in specific contexts
]

[tool.pylint.format]
max-line-length = 120
good-names = ["i", "j", "k", "ex", "_", "logger"]

[tool.pylint.basic]
argument-naming-style = "snake_case"
variable-naming-style = "snake_case"
function-naming-style = "snake_case"
