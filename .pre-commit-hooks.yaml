- id: freecad-export
  name: FreeCAD 3MF Export
  entry: hooks/freecad-export
  language: script
  stages: [pre-push]
  always_run: true
  pass_filenames: false
  description: Export FreeCAD bodies to 3MF when pushing

- id: freecad-export-manual
  name: FreeCAD 3MF Export (Manual)
  entry: hooks/freecad-export-manual
  language: script
  stages: [manual]
  always_run: true
  pass_filenames: false
  description: Manually run FreeCAD 3MF export
