default_stages: [pre-commit]
fail_fast: true
minimum_pre_commit_version: "2.13.0"

repos:
  # Security & secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  # Fast Python linting, formatting, and import sorting (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.7
    hooks:
      - id: ruff
        name: Ruff lint
        description: Lint Python files and fix errors automatically
        args: [--fix]
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        description: Format Python files
        types_or: [python, pyi]
        stages: [pre-commit]

  # YAML validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: Lint YAML files
        description: Check YAML syntax and style
        args: [--strict, -c=.yamllint]
        types: [yaml]
        stages: [pre-commit]

  # Generic pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Trim trailing whitespace
        stages: [pre-commit]

      - id: end-of-file-fixer
        name: Fix end of file
        description: Ensure files end with a newline
        stages: [pre-commit]

      - id: check-yaml
        name: Check YAML syntax
        description: Check YAML files for syntax errors
        stages: [pre-commit]

      - id: check-json
        name: Check JSON syntax
        description: Check JSON files for syntax errors
        stages: [pre-commit]

      - id: check-added-large-files
        name: Check for large files
        description: Prevent giant files from being committed
        args: [--maxkb=1000]
        stages: [pre-commit]
