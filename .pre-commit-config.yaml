default_stages: [pre-commit]
fail_fast: true
minimum_pre_commit_version: "2.13.0"

repos:
  # Security & secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  # Fast Python linting, formatting, and import sorting (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        name: Ruff lint
        description: Lint Python files and fix errors automatically
        args: [--fix]
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        description: Format Python files
        types_or: [python, pyi]
        stages: [pre-commit]

  # YAML validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        description: Check YAML syntax and style
        args: [--strict, -c=.yamllint]
        types: [yaml]
        stages: [pre-commit]

  # Generic pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Trim trailing whitespace
        stages: [pre-commit]

      - id: end-of-file-fixer
        name: Fix end of file
        description: Ensure files end with a newline
        stages: [pre-commit]

      - id: check-yaml
        name: Check YAML syntax
        description: Check YAML files for syntax errors
        stages: [pre-commit]

      - id: check-json
        name: Check JSON syntax
        description: Check JSON files for syntax errors
        stages: [pre-commit]

      - id: check-added-large-files
        name: Check for large files
        description: Prevent giant files from being committed
        args: [--maxkb=1000]
        stages: [pre-commit]

  # Deeper Python error checks (run before push)
  - repo: local
    hooks:
      - id: pylint-errors-tools
        name: Pylint errors/failures (tools)
        description: Run pylint E/F checks on tools scripts
        entry: uv run pylint --disable=all --enable=E,F tools/*.py
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pylint-errors-macros
        name: Pylint errors/failures (macros)
        description: Run pylint E/F checks on macros with FreeCAD-specific allowances
        entry: uv run pylint --disable=all --enable=E,F --disable=E0401,E1101 macros/*.py
        language: system
        pass_filenames: false
        stages: [pre-push]
