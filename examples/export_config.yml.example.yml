export:
  # Basic export example - simple body list
  - name: Moxon_OE1EBG
    source: Moxon_OE1EBG.FCStd
    # Can specify bodies by Name (Body) or Label (Feed001, Cover001, etc) - more user-friendly
    bodies:
      - Feed001           # Actual Label: Feed001 (Name: Body)
      - Cover001          # Actual Label: Cover001 (Name: Body002)
      - "Angle Round"     # Actual Label: Angle Round (Name: Body003)
      - "Angle Round"     # Export the same body twice for a 2-piece set
    # Optional: output filename (default: prints/{name}.3mf)
    output: prints/Moxon_OE1EBG.3mf
    # Optional: template 3MF file with pre-configured printer settings
    template: template_print_settings.3mf
    # Keep generated STL files after creating 3MF (default: false)
    keep_stl: true
    # Directory to store STL files (only used if keep_stl is true)
    stl_output_dir: prints/stl
    # Optional: metadata to embed in the 3MF file
    metadata:
      Project: "Moxon_OE1EBG"
      Version: "1.0"
      Author: "John Doe"
      # Git metadata is automatically added if available (GitCommit, GitBranch, etc)

  # Advanced example: Bodies with orientation and positioning
  - name: Moxon_With_Orientation
    source: Moxon_OE1EBG.FCStd
    # Bodies can be specified as strings (simple format) or objects with transforms
    bodies:
      # Simple string format - no transforms
      - Feed001
      # Object format - with optional rotation and position
      - body: "Angle Round"
        # Optional: rotation in degrees [X, Y, Z]
        # Rotations are applied in intrinsic order: X -> Y -> Z
        rotation: [0, 0, 45]
      # Same body with different position
      - body: "Angle Round"
        rotation: [0, 0, 225]
        # Optional: position offset in mm [X, Y, Z]
        position: [10, 0, 0]
    output: prints/Moxon_With_Orientation.3mf
    metadata:
      Project: "Moxon_OE1EBG_Oriented"
      Version: "1.0"
      Author: "Jane Doe"

  # Advanced example: Export only marked bodies
  - name: SelectiveExport
    source: AnotherDesign.FCStd
    # To use automatic body selection, mark bodies with the ExportTo3MF custom property set to True
    # If bodies list is empty, all bodies marked with ExportTo3MF=True will be exported
    bodies: []
    output: prints/SelectiveExport.3mf
    metadata:
      Project: "AnotherDesign"
      Version: "2.1"

  # TechDraw + BOM export example
  - name: AssemblyProject
    source: MyAssembly.FCStd
    bodies:
      - Body
      - Body001
    output: prints/MyAssembly.3mf

    # TechDraw pages → multi-page PDF (with BOM table + instructions)
    techdraw:
      pages: []                          # Empty = all TechDraw pages
      output_dir: docs                   # Output directory for PDF
      format: pdf                        # Generates {name}.pdf
      instructions: INSTRUCTIONS.md      # Optional: markdown included in PDF

    # Bill of Materials → CSV (also embedded in TechDraw PDF)
    bom:
      source: assembly                   # Read from Assembly::BomObject
      output: docs/bom.csv              # CSV output path
      fields:
        - material                       # Optional custom fields
