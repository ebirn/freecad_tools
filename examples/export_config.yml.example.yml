export:
  # Basic export example - simple body list
  # body_source: config is inferred from bodies list presence (backward compatible)
  - name: Moxon_OE1EBG
    source: Moxon_OE1EBG.FCStd
    body_source: config      # Explicit: bodies listed in config
    # Can specify bodies by Name (Body) or Label (Feed001, Cover001, etc) - more user-friendly
    bodies:
      - Feed001           # Actual Label: Feed001 (Name: Body)
      - Cover001          # Actual Label: Cover001 (Name: Body002)
      - "Angle Round"     # Actual Label: Angle Round (Name: Body003)
      - "Angle Round"     # Export the same body twice for a 2-piece set
    # Optional: output filename (default: prints/{name}.3mf)
    output: prints/Moxon_OE1EBG.3mf
    # Optional: template 3MF file with pre-configured printer settings
    template: template_print_settings.3mf
    # Keep generated STL files after creating 3MF (default: false)
    keep_stl: true
    # Directory to store STL files (only used if keep_stl is true)
    stl_output_dir: prints/stl
    # Optional: metadata to embed in the 3MF file
    metadata:
      Project: "Moxon_OE1EBG"
      Version: "1.0"
      Author: "John Doe"
      # Git metadata is automatically added if available (GitCommit, GitBranch, etc)

  # Advanced example: Bodies with Euler rotation (existing format - backward compatible)
  - name: Moxon_With_Euler_Rotation
    source: Moxon_OE1EBG.FCStd
    body_source: config
    # Bodies can be strings or objects with transforms
    bodies:
      # Simple string format - no transforms
      - Feed001
      # Object format - with Euler rotation [X, Y, Z] degrees, intrinsic XYZ order
      - body: "Angle Round"
        rotation: [0, 0, 45]    # Euler: 45° around Z
      # Same body with different position
      - body: "Angle Round"
        rotation: [0, 0, 225]  # Euler: 225° around Z
        position: [10, 0, 0]    # Position offset in mm [X, Y, Z]
    output: prints/Moxon_With_Euler_Rotation.3mf
    metadata:
      Project: "Moxon_OE1EBG_Euler"
      RotationFormat: "Euler XYZ"

  # NEW! Example: Bodies with axis+angle rotation (matches FreeCAD GUI display)
  - name: Moxon_With_AxisAngle_Rotation
    source: Moxon_OE1EBG.FCStd
    body_source: config
    # Using axis+angle format: {axis: [x, y, z], angle: degrees}
    bodies:
      - Feed001
      - body: "Angle Round"
        rotation:
          axis: [0, 0, 1]      # Z-axis direction
          angle: 45           # 45 degrees around that axis
      - body: "Angle Round"
        rotation:
          axis: [0, 0, 1]
          angle: 225
        position: [10, 0, 0]
    output: prints/Moxon_With_AxisAngle_Rotation.3mf
    metadata:
      Project: "Moxon_OE1EBG_AxisAngle"
      RotationFormat: "AxisAngle"

  # NEW! Example: Property-based body selection
  - name: PropertyExport
    source: AnotherDesign.FcsTd
    body_source: properties   # Use FreeCAD properties instead of config list
    # When body_source is 'properties', bodies list is not used
    # Bodies with ExportTo3MF=True custom property will be exported
    # Use macros/set_export_properties.py to set these properties
    output: prints/PropertyExport.3mf
    metadata:
      Project: "AnotherDesign"
      Version: "1.0"

  # NEW! Example: Property-based with count and rotation
  # When using body_source: properties, each body's ExportCount and ExportRotation
  # properties are automatically read and applied:
  # - ExportCount: Number of copies to export
  # - ExportRotation: Axis+angle rotation for each copy
  - name: PropertyExportWithTransforms
    source: AnotherDesign.FCStd
    body_source: properties
    output: prints/PropertyExportWithTransforms.3mf
    metadata:
      Project: "AnotherDesign"
      Notes: "Bodies are marked with ExportTo3MF=True and can have ExportCount > 1 and ExportRotation"

  # TechDraw + BOM export example
  - name: AssemblyProject
    source: MyAssembly.FCStd
    bodies:
      - Body
      - Body001
    output: prints/MyAssembly.3mf

    # TechDraw pages → multi-page PDF (with BOM table + instructions)
    techdraw_source: all                 # all = export every TechDraw page; config = use techdraw.pages
    techdraw:
      pages: []                          # Used only when techdraw_source: config
      output_dir: docs                   # Output directory for PDF
      format: pdf                        # Generates {name}.pdf
      instructions: INSTRUCTIONS.md      # Optional: markdown included in PDF

    # Bill of Materials → CSV (also embedded in TechDraw PDF)
    bom:
      source: assembly                   # Read from Assembly::BomObject
      output: docs/bom.csv              # CSV output path
      fields:
        - material                       # Optional custom fields

  # Screenshot generation example for Thingiverse/Printables publication
  - name: MyProject_With_Screenshots
    source: MyProject.FCStd
    bodies:
      - MainBody
      - SupportBracket
    output: prints/MyProject.3mf

    # Screenshot generation for publication platforms
    screenshot_source: export            # export = use export bodies; config = use screenshots.bodies
    screenshots:
      enabled: true                     # Enable screenshot generation
      output_dir: docs/images/          # Where to save screenshot images
      views:                            # List of view angles to capture
        - isometric                     # SW isometric (default)
        - front                         # Front view
        - top                           # Top-down view
        - right                         # Right side view
      resolution: [1920, 1080]          # Image dimensions [width, height]
      background: [255, 255, 255, 255]  # RGBA background color (white)
      format: png                       # Output format: png or jpg
      composite: true                   # True = all bodies together, False = per-body

  # Minimal screenshot example (uses defaults)
  - name: SimpleScreenshots
    source: Simple.FCStd
    bodies:
      - Body
    screenshots: true                 # Short form: enabled with all defaults
    output: prints/Simple.3mf
