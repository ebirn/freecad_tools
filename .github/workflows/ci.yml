name: CI
on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check tools/ tests/ macros/
      - run: uv run ruff format --check tools/ tests/ macros/
      - run: uv run yamllint -c .yamllint .pre-commit-hooks.yaml .pre-commit-config.yaml
      - run: uv run pylint --disable=all --enable=E,F tools/*.py
      - run: uv run pylint --disable=all --enable=E,F --disable=E0401,E1101 macros/*.py
      - run: >-
          uv run pytest
          tests/test_git_utils.py
          tests/test_lib3mf_utils.py
          tests/test_export_config.py
          tests/test_techdraw_pdf.py
          tests/test_bom_utils.py
          --cov=tools
          --cov-report=xml
          --cov-report=term-missing
          -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
