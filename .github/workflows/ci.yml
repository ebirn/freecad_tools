# CI — lint, format, and unit tests on every push/PR.
# Audience: freecad_tools contributors and maintainers.
# Trigger: push to any branch, pull_request, or manual dispatch.
# This is the fastest feedback loop — no FreeCAD or container required.

name: CI

on: [push, workflow_dispatch]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check tools/ tests/ macros/
      - run: uv run ruff format --check tools/ tests/ macros/
      - run: uv run yamllint -c .yamllint .pre-commit-hooks.yaml .pre-commit-config.yaml
      - run: uv run pylint --disable=all --enable=E,F tools/*.py
      - run: uv run pylint --disable=all --enable=E,F --disable=E0401,E1101 macros/*.py
      - name: Run unit tests
        run: |
          uv run pytest \
            tests/ \
            --ignore=tests/test_fc_export_integration.py \
            --ignore=tests/test_export.py \
            --cov=tools \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
      - name: Validate package build
        run: |
          rm -rf build dist *.egg-info
          uv build --sdist --wheel -o dist/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@3f20e214133d0983f9a10f3d63b0faf9241a3daa # v6.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
