# Build Container Image — build and push Docker images to GHCR.
#
# Audience: freecad_tools maintainers only (not for consumer repos).
# Trigger: push to any branch or tag, or manual dispatch.
# Builds two variants: tools (slim, no FreeCAD) and freecad (with FreeCAD runtime).

# Build Container Image — build and push Docker images to GHCR.
#
# Audience: freecad_tools maintainers only (not for consumer repos).
# Trigger: push to any branch or tag, or manual dispatch.
# Builds two variants: tools (slim, no FreeCAD) and freecad (with FreeCAD runtime).

name: Build Container Image

on:
  push:
    branches:
      - main
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: tools
            latest_tag: latest
            target: tools
          - variant: freecad
            latest_tag: freecad-latest
            target: freecad

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=${{ matrix.variant }}-
            type=ref,event=branch,prefix=${{ matrix.variant }}-
            type=ref,event=tag,prefix=${{ matrix.variant }}-
            type=raw,value=${{ matrix.latest_tag }},enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
