# Publish freecad-tools to PyPI.
#
# Audience: freecad_tools maintainers only (not for consumer repos).
# Trigger: workflow_call from this repo's release orchestrator, or manual dispatch.
# Builds sdist + wheel and optionally publishes to PyPI via trusted publishing (OIDC).
# GitHub Release asset upload is intentionally handled by release.yml to avoid races.
#
# To dry-run locally: uv build && twine check dist/*

name: Publish to PyPI

on:
  workflow_call:
    inputs:
      dry_run:
        description: Build packages without uploading
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build packages without uploading
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: |
          rm -rf build dist *.egg-info
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.dry_run != true }}
    environment:
      name: pypi
      url: https://pypi.org/p/freecad-tools
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/

      - name: Install publish tool
        run: pip install uv

      - name: Publish to PyPI
        run: uv publish --trusted-publishing automatic dist/*
