# Publish freecad-tools to PyPI.
#
# Audience: freecad_tools maintainers only (not for consumer repos).
# Trigger: workflow_call from this repo's release orchestrator, or manual dispatch.
# Builds sdist + wheel and optionally publishes to PyPI via trusted publishing (OIDC).
# GitHub Release asset upload is intentionally handled by release.yml to avoid races.
#
# To dry-run locally: uv build && twine check dist/*

name: Publish to PyPI

on:
  workflow_call:
    inputs:
      dry_run:
        description: Build packages without uploading
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build packages without uploading
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: |
          rm -rf build dist *.egg-info
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.dry_run != true }}
    environment:
      name: pypi
      url: https://pypi.org/p/freecad-tools
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist/

      - name: Install publish tool
        run: pip install uv

      - name: Publish to PyPI
        run: uv publish --trusted-publishing automatic dist/*
