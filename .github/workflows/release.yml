# Release freecad_tools itself.
#
# Audience: freecad_tools maintainers only (not for consumer repos).
# Trigger: pushed version tags (v*) or manual dispatch.
# Coordinates PyPI package publication and GitHub Release asset upload so the
# release exists before attaching sdist/wheel artifacts.

name: Release freecad_tools

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build packages without publishing or creating a release
        required: false
        default: true
        type: boolean
      release_tag:
        description: Tag to publish when dry_run is false
        required: false
        default: ""
        type: string

jobs:
  publish-pypi:
    uses: ./.github/workflows/publish-pypi.yml
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  github-release:
    runs-on: ubuntu-latest
    needs: publish-pypi
    if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download PyPI distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/

      - name: Attach PyPI distributions to GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.release_tag }}"
          fi
          if [[ -z "$release_tag" ]]; then
            echo "release_tag is required for manual non-dry-run releases" >&2
            exit 1
          fi

          (
            cd dist
            sha256sum * > pypi-checksums.sha256
          )

          {
            echo "# Release ${release_tag}"
            echo
            echo "Python package distributions generated by freecad_tools PyPI workflow."
            echo
            echo "## Assets"
            for asset in dist/*; do
              echo "- $(basename "$asset")"
            done
            echo
            echo "## Checksums"
            echo '```'
            cat dist/pypi-checksums.sha256
            echo '```'
          } > release-notes.md

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --notes-file release-notes.md
          else
            gh release create "$release_tag" --title "$release_tag" --notes-file release-notes.md
          fi

          gh release upload "$release_tag" dist/* --clobber
