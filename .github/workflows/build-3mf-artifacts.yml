name: Build 3MF Artifacts

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to export YAML config file
        required: false
        type: string
        default: "export_config.yml"
      export_name:
        description: Optional single export item name
        required: false
        default: ""
        type: string
      project_root:
        description: Working directory for the export command
        required: false
        default: "."
        type: string
      gui_session:
        description: GUI session mode (item or run)
        required: false
        default: "item"
        type: string
      dry_run:
        description: Validate workflow without running slicers/exports
        required: false
        default: true
        type: boolean
      artifact_glob:
        description: Artifact path glob to upload
        required: false
        default: "prints/**"
        type: string
      container_image:
        description: Container image used to run export workflow
        required: false
        default: "ghcr.io/ebirn/freecad_tools:freecad-latest"
        type: string
      runner:
        description: GitHub runner label (must provide FreeCAD for non-dry runs)
        required: false
        default: "ubuntu-latest"
        type: string
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to export YAML config file
        required: true
        default: "export_config.yml"
        type: string
      export_name:
        description: Optional single export item name
        required: false
        default: ""
        type: string
      project_root:
        description: Working directory for the export command
        required: false
        default: "."
        type: string
      gui_session:
        description: GUI session mode
        required: false
        default: "item"
        type: choice
        options:
          - item
          - run
      dry_run:
        description: Validate only (recommended unless runner has FreeCAD)
        required: false
        default: true
        type: boolean
      artifact_glob:
        description: Artifact path glob to upload
        required: false
        default: "prints/**"
        type: string
      container_image:
        description: Container image used to run export workflow
        required: false
        default: "ghcr.io/ebirn/freecad_tools:freecad-latest"
        type: string
      runner:
        description: GitHub runner label (must provide FreeCAD for non-dry runs)
        required: false
        default: "ubuntu-latest"
        type: string

jobs:
  build-3mf-artifacts:
    runs-on: ${{ inputs.runner || github.event.inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull container image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ inputs.container_image ||
            github.event.inputs.container_image ||
            'ghcr.io/ebirn/freecad_tools:freecad-latest' }}"
          docker pull "$image"

      - name: Run export
        shell: bash
        run: |
          set -euo pipefail
          image="${{ inputs.container_image ||
            github.event.inputs.container_image ||
            'ghcr.io/ebirn/freecad_tools:freecad-latest' }}"
          config_path="${{ inputs.config_path || github.event.inputs.config_path || 'export_config.yml' }}"
          export_name="${{ inputs.export_name || github.event.inputs.export_name }}"
          gui_session="${{ inputs.gui_session || github.event.inputs.gui_session || 'item' }}"
          dry_run="${{ inputs.dry_run || github.event.inputs.dry_run || 'true' }}"
          project_root="${{ inputs.project_root || github.event.inputs.project_root || '.' }}"

          cmd=("$config_path" "--gui-session" "$gui_session")
          if [[ -n "$export_name" ]]; then
            cmd+=("--name" "$export_name")
          fi
          if [[ "$dry_run" == "true" ]]; then
            cmd+=("--dry-run" "--slicer-dry-run")
          fi

          printf 'Running export command in container: %q ' "${cmd[@]}"
          printf '\n'

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w "/workspace/$project_root" \
            "$image" "${cmd[@]}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freecad-tools-artifacts
          path: ${{ inputs.artifact_glob || github.event.inputs.artifact_glob || 'prints/**' }}
          if-no-files-found: warn
