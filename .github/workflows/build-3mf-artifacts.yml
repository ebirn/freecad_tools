name: Build 3MF Artifacts

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to export YAML config file
        required: false
        type: string
        default: "export_config.yml"
      export_name:
        description: Optional single export item name
        required: false
        default: ""
        type: string
      project_root:
        description: Working directory for the export command
        required: false
        default: "."
        type: string
      gui_session:
        description: GUI session mode (item or run)
        required: false
        default: "item"
        type: string
      dry_run:
        description: Validate workflow without running slicers/exports
        required: false
        default: true
        type: boolean
      artifact_glob:
        description: Artifact path glob to upload
        required: false
        default: "prints/**"
        type: string
      container_image:
        description: Container image used to run export workflow
        required: false
        default: "ghcr.io/ebirn/freecad_tools:freecad-latest"
        type: string
      runner:
        description: GitHub runner label (must provide FreeCAD for non-dry runs)
        required: false
        default: "ubuntu-latest"
        type: string
      freecad_gui_binary:
        description: Optional FreeCAD GUI binary path inside container
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to export YAML config file
        required: true
        default: "export_config.yml"
        type: string
      export_name:
        description: Optional single export item name
        required: false
        default: ""
        type: string
      project_root:
        description: Working directory for the export command
        required: false
        default: "."
        type: string
      gui_session:
        description: GUI session mode
        required: false
        default: "item"
        type: choice
        options:
          - item
          - run
      dry_run:
        description: Validate only (recommended unless runner has FreeCAD)
        required: false
        default: true
        type: boolean
      artifact_glob:
        description: Artifact path glob to upload
        required: false
        default: "prints/**"
        type: string
      container_image:
        description: Container image used to run export workflow
        required: false
        default: "ghcr.io/ebirn/freecad_tools:freecad-latest"
        type: string
      runner:
        description: GitHub runner label (must provide FreeCAD for non-dry runs)
        required: false
        default: "ubuntu-latest"
        type: string
      freecad_gui_binary:
        description: Optional FreeCAD GUI binary path inside container
        required: false
        default: ""
        type: string

jobs:
  build-3mf-artifacts:
    runs-on: ${{ inputs.runner || github.event.inputs.runner || 'ubuntu-latest' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull container image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ inputs.container_image ||
            github.event.inputs.container_image ||
            'ghcr.io/ebirn/freecad_tools:freecad-latest' }}"
          docker pull "$image"

      - name: Start export container service
        shell: bash
        run: |
          set -euo pipefail
          image="${{ inputs.container_image ||
            github.event.inputs.container_image ||
            'ghcr.io/ebirn/freecad_tools:freecad-latest' }}"
          container_name="freecad-tools-export-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "EXPORT_CONTAINER_NAME=$container_name" >> "$GITHUB_ENV"

          docker_args=(
            -d
            --rm
            --name "$container_name"
            -e VIRTUAL_ENV=
            -e UV_LINK_MODE=copy
            -v "$GITHUB_WORKSPACE:/project"
          )
          freecad_gui_binary="${{ inputs.freecad_gui_binary || github.event.inputs.freecad_gui_binary }}"
          if [[ -n "$freecad_gui_binary" ]]; then
            docker_args+=( -e "FREECAD_GUI_BINARY=$freecad_gui_binary" )
          fi
          docker run "${docker_args[@]}" "$image"

      - name: Run export
        shell: bash
        run: |
          set -euo pipefail
          config_path="${{ inputs.config_path || github.event.inputs.config_path || 'export_config.yml' }}"
          export_name="${{ inputs.export_name || github.event.inputs.export_name }}"
          gui_session="${{ inputs.gui_session || github.event.inputs.gui_session || 'item' }}"
          dry_run="${{ inputs.dry_run }}"
          if [[ -z "$dry_run" ]]; then
            dry_run="${{ github.event.inputs.dry_run || 'true' }}"
          fi
          project_root="${{ inputs.project_root || github.event.inputs.project_root || '.' }}"
          freecad_gui_binary="${{ inputs.freecad_gui_binary || github.event.inputs.freecad_gui_binary }}"
          workspace_project_dir="$GITHUB_WORKSPACE/$project_root"
          config_file_host="$workspace_project_dir/$config_path"
          config_file_container="/project/$project_root/$config_path"

          if [[ ! -f "$config_file_host" ]]; then
            echo "Config file not found in caller repository: $config_file_host" >&2
            exit 1
          fi

          readiness_cmd="test -x /opt/freecad/usr/bin/freecadcmd"
          readiness_cmd+=" || test -x /usr/bin/freecadcmd"
          readiness_cmd+=" || test -x /freecad_tools/export.sh"
          for _ in $(seq 1 45); do
            if docker exec "$EXPORT_CONTAINER_NAME" /bin/sh -lc \
              "$readiness_cmd" \
              >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          # Ensure mounted workspace is writable by container app user.
          docker exec "$EXPORT_CONTAINER_NAME" /bin/sh -lc \
            "mkdir -p /project/$project_root/prints /project/$project_root/docs"
          docker exec "$EXPORT_CONTAINER_NAME" /bin/sh -lc \
            "chown -R abc:abc /project/$project_root"

          cmd=("--config" "$config_file_container" "--gui-session" "$gui_session")
          if [[ -n "$export_name" ]]; then
            cmd+=("--name" "$export_name")
          fi
          if [[ "$dry_run" == "true" ]]; then
            cmd+=("--dry-run" "--slicer-dry-run")
          fi

          printf 'Running export command in container: %q ' "${cmd[@]}"
          printf '\n'
          exec_args=(
            -e VIRTUAL_ENV=
            -e UV_LINK_MODE=copy
          )
          if [[ -n "$freecad_gui_binary" ]]; then
            exec_args+=( -e "FREECAD_GUI_BINARY=$freecad_gui_binary" )
          fi
          cmd_str=""
          for part in "${cmd[@]}"; do
            cmd_str+="$(printf '%q' "$part") "
          done
          docker exec --user abc "${exec_args[@]}" "$EXPORT_CONTAINER_NAME" /bin/bash -lc \
            "/freecad_tools/export.sh ${cmd_str}"

      - name: Stop export container service
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${EXPORT_CONTAINER_NAME:-}" ]]; then
            docker stop "$EXPORT_CONTAINER_NAME" >/dev/null 2>&1 || true
          fi

      - name: Upload artifacts
        if: ${{ always() && inputs.dry_run != true && github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freecad-tools-artifacts
          path: ${{ inputs.artifact_glob || github.event.inputs.artifact_glob || 'prints/**' }}
          if-no-files-found: warn
