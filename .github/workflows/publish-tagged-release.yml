# Publish Tagged Release — validates and publishes a version-tagged release bundle.
#
# Audience: consumer repos (FreeCAD projects using freecad_tools) AND freecad_tools itself.
# Trigger: workflow_call (from consumer tag-push workflows) or manual dispatch.
# Runs release readiness gates, 3MF export validation, then creates a GitHub Release with bundled artifacts.

# Publish Tagged Release — validates and publishes a version-tagged release bundle.
#
# Audience: consumer repos (FreeCAD projects using freecad_tools) AND freecad_tools itself.
# Trigger: workflow_call (from consumer tag-push workflows) or manual dispatch.
# Runs release readiness gates, 3MF export validation, then creates a GitHub Release with bundled artifacts.

name: Publish Tagged Release

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to export YAML config file
        required: false
        default: "export_config.yml"
        type: string
      project_root:
        description: Working directory for export config
        required: false
        default: "."
        type: string
      gui_session:
        description: GUI session mode for validation job
        required: false
        default: "run"
        type: string
      dry_run:
        description: Run export in dry-run mode
        required: false
        default: false
        type: boolean
      runner:
        description: Runner label
        required: false
        default: "ubuntu-latest"
        type: string
      container_image:
        description: Container image used by validation job
        required: false
        default: "ghcr.io/ebirn/freecad_tools:freecad-latest"
        type: string
      output_root:
        description: Output root override passed to export workflow
        required: false
        default: "generated"
        type: string
      techdraw_timeout:
        description: Optional TechDraw timeout in seconds for export validation
        required: false
        default: "300"
        type: string
      release_tag:
        description: Optional explicit release tag
        required: false
        default: ""
        type: string
      bundle_name:
        description: Prefix for generated release bundle base name
        required: false
        default: "demo-artifacts"
        type: string
      bundle_paths:
        description: Space-separated repository paths to include in bundle
        required: false
        default: "README.md export_config.yml example.FCStd .github/workflows"
        type: string
      generated_paths:
        description: Space-separated generated output paths to include
        required: false
        default: "generated"
        type: string

jobs:
  validate-release-readiness:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve reusable workflow ref
        id: freecad_tools_ref
        shell: bash
        run: |
          set -euo pipefail
          workflow_ref="${GITHUB_WORKFLOW_REF}"
          resolved_ref="${workflow_ref##*@}"
          echo "resolved_ref=${resolved_ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout freecad_tools workflow sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ebirn/freecad_tools
          ref: ${{ steps.freecad_tools_ref.outputs.resolved_ref }}
          path: _freecad_tools

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install PyYAML

      - name: Validate release readiness
        run: |
          python _freecad_tools/tools/release_validator.py --project-root . --summary

      - name: Generate checksums for bundle paths
        run: |
          bundle_paths="${{ inputs.bundle_paths }}"
          mkdir -p dist
          python _freecad_tools/tools/release_validator.py \
            --checksums $bundle_paths \
            --checksum-output dist/checksums.sha256

      - name: Upload release summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-summary
          path: dist/checksums.sha256

  validate-export-config:
    uses: ./.github/workflows/build-3mf-artifacts.yml
    needs: validate-release-readiness
    with:
      config_path: ${{ inputs.config_path }}
      project_root: ${{ inputs.project_root }}
      gui_session: ${{ inputs.gui_session }}
      dry_run: ${{ inputs.dry_run }}
      output_root: ${{ inputs.output_root }}
      techdraw_timeout: ${{ inputs.techdraw_timeout }}
      artifact_glob: ${{ inputs.output_root }}/**
      container_image: ${{ inputs.container_image }}
      runner: ${{ inputs.runner }}

  publish-tagged-release:
    runs-on: ${{ inputs.runner }}
    needs: validate-export-config
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download release summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-summary
          path: dist

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ inputs.release_tag }}"
          if [[ -z "$release_tag" ]]; then
            if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
              echo "release_tag input is required for non-tag triggers" >&2
              exit 1
            fi
            release_tag="${GITHUB_REF_NAME:-}"
          fi
          if [[ -z "$release_tag" ]]; then
            echo "Unable to determine release tag" >&2
            exit 1
          fi

          mkdir -p dist
          {
            echo "release_tag=${release_tag}"
            echo "commit=${GITHUB_SHA}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/release-metadata.txt

      - name: Download generated export artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          gh run download "$GITHUB_RUN_ID" \
            --name freecad-tools-artifacts \
            --dir generated

      - name: Build release bundle and notes
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${RELEASE_TAG:-${{ inputs.release_tag }}}"
          if [[ -z "$release_tag" ]]; then
            release_tag="${GITHUB_REF_NAME:-}"
          fi

          bundle_base="${{ inputs.bundle_name }}-${release_tag}"
          bundle_base="${bundle_base%.tar.gz}"
          bundle_base="${bundle_base%.zip}"
          bundle_paths="${{ inputs.bundle_paths }}"
          generated_paths="${{ inputs.generated_paths }}"

          include_paths=()
          missing_bundle_paths=()
          for p in $bundle_paths; do
            if [[ -e "$p" ]]; then
              include_paths+=("$p")
            else
              missing_bundle_paths+=("$p")
            fi
          done
          if (( ${#missing_bundle_paths[@]} > 0 )); then
            printf 'Missing required bundle path: %s\n' "${missing_bundle_paths[@]}" >&2
            exit 1
          fi
          for p in $generated_paths; do
            if [[ -e "$p" ]]; then
              include_paths+=("$p")
            elif [[ -e "generated/$p" ]]; then
              mkdir -p "$(dirname "$p")"
              cp -R "generated/$p" "$p"
              include_paths+=("$p")
            fi
          done
          include_paths+=("dist/release-metadata.txt")
          include_paths+=("dist/checksums.sha256")
          printf 'Including bundle paths:\n%s\n' "${include_paths[*]}"
          tar -czf "dist/${bundle_base}.tar.gz" "${include_paths[@]}"
          zip -r "dist/${bundle_base}.zip" "${include_paths[@]}"

          {
            echo "# Release ${release_tag}"
            echo
            echo "Generated by reusable workflow in ebirn/freecad_tools."
            echo
            echo "## Assets"
            echo "- ${bundle_base}.tar.gz"
            echo "- ${bundle_base}.zip"
            echo
            echo "## Checksums"
            echo '```'
            cat dist/checksums.sha256
            echo '```'
            echo
            echo "## Validation"
            echo "- export workflow completed (dry_run=${{ inputs.dry_run }})"
          } > dist/release-notes.md

          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "BUNDLE_BASE=${bundle_base}" >> "$GITHUB_ENV"

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file dist/release-notes.md
          fi

      - name: Upload release asset
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dist/$BUNDLE_BASE.tar.gz" \
            "dist/$BUNDLE_BASE.zip" \
            --clobber
