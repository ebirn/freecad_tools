name: Publish Nightly Release

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to export YAML config file
        required: false
        default: "export_config.yml"
        type: string
      project_root:
        description: Working directory for export config
        required: false
        default: "."
        type: string
      gui_session:
        description: GUI session mode for validation job
        required: false
        default: "run"
        type: string
      dry_run:
        description: Run export in dry-run mode
        required: false
        default: false
        type: boolean
      runner:
        description: Runner label
        required: false
        default: "ubuntu-latest"
        type: string
      container_image:
        description: Container image used by validation job
        required: false
        default: "ghcr.io/ebirn/freecad_tools:freecad-latest"
        type: string
      freecad_gui_binary:
        description: Optional FreeCAD GUI binary path inside container
        required: false
        default: ""
        type: string
      nightly_tag:
        description: Rolling release tag to maintain
        required: false
        default: "nightly"
        type: string
      bundle_name:
        description: Base release bundle file name (without extension)
        required: false
        default: "demo-artifacts-nightly"
        type: string
      bundle_paths:
        description: Space-separated repository paths to include in bundle
        required: false
        default: "README.md export_config.yml example.FCStd .github/workflows"
        type: string
      generated_paths:
        description: Space-separated generated output paths to include
        required: false
        default: "generated"
        type: string

jobs:
  validate-export-config:
    uses: ./.github/workflows/build-3mf-artifacts.yml
    with:
      config_path: ${{ inputs.config_path }}
      project_root: ${{ inputs.project_root }}
      gui_session: ${{ inputs.gui_session }}
      dry_run: ${{ inputs.dry_run }}
      artifact_glob: |
        prints/**
        docs/**
      container_image: ${{ inputs.container_image }}
      freecad_gui_binary: ${{ inputs.freecad_gui_binary }}
      runner: ${{ inputs.runner }}

  publish-nightly-release:
    runs-on: ${{ inputs.runner }}
    needs: validate-export-config
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download generated export artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          gh run download "$GITHUB_RUN_ID" \
            --name freecad-tools-artifacts \
            --dir generated

      - name: Build nightly bundle and notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "release_tag=${{ inputs.nightly_tag }}"
            echo "commit=${GITHUB_SHA}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/nightly-metadata.txt

          bundle_paths="${{ inputs.bundle_paths }}"
          generated_paths="${{ inputs.generated_paths }}"
          include_paths=()
          for p in $bundle_paths $generated_paths; do
            if [[ -e "$p" ]]; then
              include_paths+=("$p")
            fi
          done
          include_paths+=("dist/nightly-metadata.txt")
          bundle_base="${{ inputs.bundle_name }}"
          tar -czf "dist/${bundle_base}.tar.gz" "${include_paths[@]}"
          zip -r "dist/${bundle_base}.zip" "${include_paths[@]}"

          {
            echo "# Nightly Release"
            echo
            echo "Rolling release generated by reusable workflow in ebirn/freecad_tools."
            echo
            echo "## Assets"
            echo "- ${bundle_base}.tar.gz"
            echo "- ${bundle_base}.zip"
            echo
            echo "## Validation"
            echo "- export workflow completed (dry_run=${{ inputs.dry_run }})"
          } > dist/nightly-release-notes.md

      - name: Create or update nightly release
        shell: bash
        run: |
          set -euo pipefail
          nightly_tag="${{ inputs.nightly_tag }}"
          if gh release view "$nightly_tag" >/dev/null 2>&1; then
            gh release edit "$nightly_tag" \
              --title "$nightly_tag" \
              --notes-file dist/nightly-release-notes.md
          else
            gh release create "$nightly_tag" \
              --title "$nightly_tag" \
              --notes-file dist/nightly-release-notes.md
          fi

      - name: Upload nightly release asset
        shell: bash
        run: |
          set -euo pipefail
          bundle_base="${{ inputs.bundle_name }}"
          gh release upload "${{ inputs.nightly_tag }}" \
            "dist/${bundle_base}.tar.gz" \
            "dist/${bundle_base}.zip" \
            --clobber
