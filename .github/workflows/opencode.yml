# OpenCode — AI coding agent triggered by GitHub issue/PR comments.
#
# Audience: freecad_tools maintainers only (not for consumer repos).
# Trigger: issue_comment or pull_request_review_comment containing /oc or /opencode.
# Runs the opencode AI agent to work on issues or PRs.

# OpenCode — AI coding agent triggered by GitHub issue/PR comments.
#
# Audience: freecad_tools maintainers only (not for consumer repos).
# Trigger: issue_comment or pull_request_review_comment containing /oc or /opencode.
# Runs the opencode AI agent to work on issues or PRs.

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@006a05abe8dd6ba5532bd93af77f3ca648cab540 # v1.14.33
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          # model: opencode/big-pickle
          model: openrouter/Qwen3.6 Plus
