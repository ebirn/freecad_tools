<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#3498db" stroke="#2980b9" stroke-width="4"/>

  <!-- 3MF/Export symbol - stylized 3D box -->
  <g transform="translate(32, 28)">
    <!-- Front face -->
    <polygon points="32,16 32,48 0,64 0,32" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <!-- Top face -->
    <polygon points="32,16 64,0 32,-16 0,0" fill="#ffffff" stroke="#bdc3c7" stroke-width="2"/>
    <!-- Right face -->
    <polygon points="32,16 64,0 64,32 32,48" fill="#bdc3c7" stroke="#95a5a6" stroke-width="2"/>

    <!-- 3D coordinate axes -->
    <!-- X axis (red) -->
    <line x1="32" y1="32" x2="52" y2="42" stroke="#e74c3c" stroke-width="3"/>
    <text x="54" y="46" font-family="Arial" font-size="10" fill="#e74c3c" font-weight="bold">X</text>

    <!-- Y axis (green) -->
    <line x1="32" y1="32" x2="42" y2="22" stroke="#2ecc71" stroke-width="3"/>
    <text x="44" y="20" font-family="Arial" font-size="10" fill="#2ecc71" font-weight="bold">Y</text>

    <!-- Z axis (blue) -->
    <line x1="32" y1="32" x2="32" y2="12" stroke="#3498db" stroke-width="3"/>
    <text x="34" y="10" font-family="Arial" font-size="10" fill="#3498db" font-weight="bold">Z</text>
  </g>

  <!-- Text "FC" for FreeCAD Tools -->
  <text x="64" y="108" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">FC</text>
</svg>
